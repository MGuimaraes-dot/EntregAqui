<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Motoboy - EntregAqui</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f5f5;padding:15px;margin:0}
.card{background:#fff;max-width:480px;margin:auto;padding:20px;border-radius:12px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
label{font-weight:bold;font-size:14px;display:block;margin-top:16px}
button{width:100%;padding:13px;background:#ff6b00;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:disabled{opacity:0.6}
.msg{margin-top:10px;padding:10px;border-radius:8px;display:none}
img.preview{width:100%;border-radius:10px;display:none;margin:8px 0}
hr{margin:22px 0}
.foto-box{border:1px solid #ddd;border-radius:10px;padding:12px;margin-top:8px}
.btns{display:flex;gap:8px}
.btn-foto{flex:1;padding:11px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;font-weight:bold;cursor:pointer;font-size:14px}
.btn-foto.cam{background:#111;color:#fff;border-color:#111}
.ok{color:green;font-size:13px;font-weight:bold;display:none;margin-top:6px}
</style>
</head>
<body>
<div class="card">
<h2>Quero ser motoboy</h2>

<form onsubmit="cadastrar(event)">
<input id="nome" placeholder="Nome completo" required>
<input id="cpf" placeholder="CPF só números" required>
<input id="telefone" placeholder="WhatsApp com DDD" required>
<input id="placa" placeholder="Placa da moto" required>
<input id="senha" type="password" placeholder="Crie uma senha" required>

<label>CNH - frente *</label>
<div class="foto-box">
  <div class="btns">
    <button type="button" class="btn-foto cam" onclick="document.getElementById('cnhCamera').click()">📷 Tirar foto</button>
    <button type="button" class="btn-foto" onclick="document.getElementById('cnhGaleria').click()">🖼️ Carregar foto</button>
  </div>
  <div id="okCNH" class="ok">✅ Foto da CNH pronta</div>
  <img id="prevCNH" class="preview">
  <input type="file" id="cnhCamera" accept="image/*" capture="environment" style="display:none" onchange="setFoto('cnh', this, 'prevCNH', 'okCNH')">
  <input type="file" id="cnhGaleria" accept="image/*" style="display:none" onchange="setFoto('cnh', this, 'prevCNH', 'okCNH')">
</div>

<label>CRLV - documento da moto *</label>
<div class="foto-box">
  <div class="btns">
    <button type="button" class="btn-foto cam" onclick="document.getElementById('crlvCamera').click()">📷 Tirar foto</button>
    <button type="button" class="btn-foto" onclick="document.getElementById('crlvGaleria').click()">🖼️ Carregar foto</button>
  </div>
  <div id="okCRLV" class="ok">✅ Foto do CRLV pronta</div>
  <img id="prevCRLV" class="preview">
  <input type="file" id="crlvCamera" accept="image/*" capture="environment" style="display:none" onchange="setFoto('crlv', this, 'prevCRLV', 'okCRLV')">
  <input type="file" id="crlvGaleria" accept="image/*" style="display:none" onchange="setFoto('crlv', this, 'prevCRLV', 'okCRLV')">
</div>

<label>Selfie com documento *</label>
<div class="foto-box">
  <div class="btns">
    <button type="button" class="btn-foto cam" onclick="document.getElementById('selfieCamera').click()">📷 Tirar foto</button>
    <button type="button" class="btn-foto" onclick="document.getElementById('selfieGaleria').click()">🖼️ Carregar foto</button>
  </div>
  <div id="okSelfie" class="ok">✅ Selfie pronta</div>
  <img id="prevSelfie" class="preview">
  <input type="file" id="selfieCamera" accept="image/*" capture="user" style="display:none" onchange="setFoto('selfie', this, 'prevSelfie', 'okSelfie')">
  <input type="file" id="selfieGaleria" accept="image/*" style="display:none" onchange="setFoto('selfie', this, 'prevSelfie', 'okSelfie')">
</div>

<button id="btnCadastrar" type="submit">Enviar cadastro</button>
</form>
<div id="msg" class="msg"></div>

<hr>
<h3>Consultar meu cadastro</h3>
<input id="cpfConsulta" placeholder="Digite seu CPF">
<button type="button" onclick="consultar()">Consultar status</button>
<div id="msgConsulta" class="msg"></div>
<br><a href="index.html">Voltar</a>
</div>

<script>
const SUPABASE_URL = "https://omxfbskvrcbbrydgsmsg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Akx4rEvoEv4SHOx4ijG-vA_WmY-vU5-";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let arquivos = { cnh: null, crlv: null, selfie: null };

function mostrar(id, texto, cor){
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.style.background = cor;
  el.textContent = texto;
}
function setFoto(tipo, input, idImg, idOk){
  const file = input.files[0];
  if(!file) return;
  arquivos[tipo] = file;
  const img = document.getElementById(idImg);
  const reader = new FileReader();
  reader.onload = e => { img.src = e.target.result; img.style.display='block'; };
  reader.readAsDataURL(file);
  document.getElementById(idOk).style.display = 'block';
}
async function enviarFoto(file, cpf, tipo){
  const nomeArquivo = cpf + '_' + tipo + '_' + Date.now() + '.jpg';
  const { error } = await supabase.storage.from('fotos-motoboys').upload(nomeArquivo, file);
  if(error) throw new Error('Erro ao enviar ' + tipo + ': ' + error.message);
  const { data } = supabase.storage.from('fotos-motoboys').getPublicUrl(nomeArquivo);
  return data.publicUrl;
}
async function cadastrar(e){
  e.preventDefault();
  const btn = document.getElementById('btnCadastrar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try{
    const cpf = document.getElementById('cpf').value.replace(/\D/g,'');
    if(!arquivos.cnh) throw new Error('Falta a foto da CNH');
    if(!arquivos.crlv) throw new Error('Falta a foto do CRLV');
    if(!arquivos.selfie) throw new Error('Falta a Selfie');

    btn.textContent = 'Enviando foto CNH...';
    const urlCNH = await enviarFoto(arquivos.cnh, cpf, 'cnh');
    btn.textContent = 'Enviando foto CRLV...';
    const urlCRLV = await enviarFoto(arquivos.crlv, cpf, 'crlv');
    btn.textContent = 'Enviando Selfie...';
    const urlSelfie = await enviarFoto(arquivos.selfie, cpf, 'selfie');

    btn.textContent = 'Salvando cadastro...';
    const dados = {
      nome: document.getElementById('nome').value.trim(),
      cpf: cpf,
      telefone: document.getElementById('telefone').value.trim(),
      placa: document.getElementById('placa').value.trim().toUpperCase(),
      senha: document.getElementById('senha').value,
      status: 'pendente',
      cidade: 'São José dos Campos',
      foto_cnh: urlCNH,
      foto_crlv: urlCRLV,
      foto_selfie: urlSelfie
    };
    const { error } = await supabase.from('motoboys').insert([dados]);
    if(error) throw error;
    mostrar('msg', 'Cadastro enviado! Fotos salvas no Supabase. Aguarde aprovação.', '#e0ffe0');
  }catch(err){
    mostrar('msg', 'ERRO: ' + (err.message || err), '#ffe0e0');
    alert('ERRO: ' + (err.message || err));
  }
  btn.disabled = false;
  btn.textContent = 'Enviar cadastro';
}
async function consultar(){
  const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
  if(!cpf){ mostrar('msgConsulta','Digite o CPF','#ffe0e0'); return; }
  const { data, error } = await supabase.from('motoboys').select('*').eq('cpf', cpf).single();
  if(error || !data){ mostrar('msgConsulta','Cadastro não encontrado.','#ffe0e0'); return; }
  if(data.status === 'pendente') mostrar('msgConsulta','Status: PENDENTE - Aguardando aprovação.','#fff3cd');
  if(data.status === 'aprovado') mostrar('msgConsulta','Status: APROVADO - Você já pode logar!','#e0ffe0');
  if(data.status === 'reprovado') mostrar('msgConsulta','Status: REPROVADO - Fale com o suporte.','#ffe0e0');
}
</script>
</body>
</html>
